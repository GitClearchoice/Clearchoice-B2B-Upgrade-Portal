# Shopify app config (managed by Shopify CLI). Same Dev Dashboard app the phase 2 import scripts use,
# so the scopes below must keep the import scopes (write_companies, write_customers, read_payment_terms).
client_id = "4b83184465ec6a5c1d5cb845bd3a8fcc"
name = "Clearchoice B2B Portal"
# Render web service. `shopify app dev` swaps in a tunnel URL automatically while developing.
application_url = "https://clearchoice-b2b.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[access_scopes]
scopes = "read_products,write_draft_orders,write_companies,write_customers,read_payment_terms,write_app_proxy"

[auth]
redirect_urls = ["https://clearchoice-b2b.onrender.com/auth/callback"]

# Storefront calls go to https://<shop>/apps/b2b/... and Shopify forwards them, signed, to /proxy/...
[app_proxy]
url = "https://clearchoice-b2b.onrender.com/proxy"
prefix = "apps"
subpath = "b2b"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"
