# Customer account extension: "Purchase orders" setting on the Profile page (a block the merchant
# places in Settings → Checkout → Customize → Profile; the company-location Payment details target
# can only be placed when the store has a B2B market, so this uses the Profile block target). Head-office admin can tick "We don't use purchase orders" (same company setting as
# the cart tick box); other buyers see the current setting. Backend: /customer/po-setting on the app.
api_version = "2026-01"
uid = "fd0fc64d-2ae4-82f6-64d4-025bd3a47ba982fa382a"

[[extensions]]
name = "Purchase orders"
handle = "po-setting"
type = "ui_extension"

  [[extensions.targeting]]
  module = "./src/PoSetting.jsx"
  target = "customer-account.profile.block.render"

  [extensions.capabilities]
  # Calls the app's own backend (https://clearchoice-b2b.onrender.com).
  network_access = true
