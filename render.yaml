# Render Blueprint: Shopify app (web), Postgres, nightly Unleashed sync (cron).
# Values marked sync: false are entered in the Render dashboard when the Blueprint is created.
databases:
  - name: clearchoice-b2b-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"

envVarGroups:
  - name: clearchoice-b2b-shared
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: UNLEASHED_BASE_URL
        value: https://api.unleashedsoftware.com
      - key: UNLEASHED_CLIENT_TYPE
        value: Clearchoice/B2BPortal
      - key: UNLEASHED_DISCOUNT_RATE_FORMAT
        value: fraction

services:
  - type: web
    name: clearchoice-b2b
    runtime: node
    region: singapore
    plan: starter
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run setup && npm run start
    healthCheckPath: /
    envVars:
      - fromGroup: clearchoice-b2b-shared
      - key: UNLEASHED_API_ID
        sync: false
      - key: UNLEASHED_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: clearchoice-b2b-db, property: connectionString }
      - key: NODE_ENV
        value: production
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      - key: SHOPIFY_APP_URL
        sync: false
      - key: SCOPES
        value: read_products,write_draft_orders,write_companies,write_customers,read_payment_terms

  # 2:00am Sydney in summer (AEDT), 1:00am in winter. Render cron times are UTC.
  - type: cron
    name: clearchoice-b2b-sync
    runtime: node
    region: singapore
    plan: starter
    schedule: "0 15 * * *"
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run sync
    envVars:
      - fromGroup: clearchoice-b2b-shared
      - key: UNLEASHED_API_ID
        sync: false
      - key: UNLEASHED_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase: { name: clearchoice-b2b-db, property: connectionString }
